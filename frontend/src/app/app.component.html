<div class="app-root">
  <app-map3d></app-map3d>

  <!-- Panel de navegación moderno -->
  <app-nav-drawer
    [isOpen]="drawerOpen"
    (closeDrawer)="closeDrawer()"
    (selectLocation)="onSelectLocation($event)"
    (destinationSelected)="onDestinationSelected($event)"
    (focusMesh)="onFocusMesh($event)"
    (navigateTo)="onNavigateTo($event)">
  </app-nav-drawer>

  <!-- Panel Modal de Administración CRUD -->
  <app-admin-panel *ngIf="adminPanelOpen" (cerrar)="closeAdminPanel()"></app-admin-panel>
</div>
