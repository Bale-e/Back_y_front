<div
  class="loc-card"
  [class.open]="isOpen"
  *ngIf="locationInfo"
>
  <!-- Cabecera -->
  <div class="loc-card__header">
    <div class="loc-card__icon">📍</div>
    <div class="loc-card__titles">
      <h3 class="loc-card__name">{{ locationInfo.nombre }}</h3>
      <div class="loc-card__badges">
        <span class="badge" *ngIf="locationInfo.edificio">Edificio {{ locationInfo.edificio }}</span>
        <span class="badge" *ngIf="locationInfo.piso">{{ locationInfo.piso }}</span>
      </div>
    </div>
    <button class="loc-card__close" (click)="onClose()" aria-label="Cerrar">✕</button>
  </div>

  <!-- Descripción -->
  <p class="loc-card__desc">{{ locationInfo.desc }}</p>

  <!-- Acción principal -->
  <button class="loc-card__nav-btn" (click)="onNavigate()">
    <span>🧭</span> Cómo llegar
  </button>
</div>
