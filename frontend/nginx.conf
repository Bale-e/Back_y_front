server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # SPA de Angular: cualquier ruta que no sea un archivo devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Bundles de Angular con hash en el nombre (main-XXXXXXXX.js): cambian de
    # nombre en cada build, así que se pueden guardar 1 año sin riesgo.
    location ~* -[A-Z0-9]{8}\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Modelos 3D, animaciones e imágenes de src/assets: NO llevan hash. Si se
    # reemplaza inacapito_walking.glb o un piso .obj con el mismo nombre, el
    # navegador debe enterarse: caché de 1 día y revalidación después.
    location ~* \.(glb|gltf|obj|mtl|fbx|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Nunca servir archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }
}
